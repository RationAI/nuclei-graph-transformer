# @package _global_
_target_: nuclei_graph.meta_archs.crop.CropModelMetaArch
neg_instance_weight: 0.0 # λ × mean BCE(nucleus logits, 0) on slides labelled 0
pseudo_pos_weight: 0.0 # μ × mean BCE(pseudo-positive nucleus logits, 1)
selection_metric: loss # loss, AUROC (which validation metric's best epoch is logged as best/)
graph_metrics_all_slides: false # true: every slide enters the graph metrics (not only those with a supervised nucleus)
init_ckpt: null # checkpoint (path or MLflow URI) whose network weights initialize the model; fresh optimizer
