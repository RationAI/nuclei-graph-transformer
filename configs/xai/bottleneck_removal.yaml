# @package _global_

# Single-concept removal from the concept bottleneck (xai.bottleneck_removal), within the
# epithelium and on all test nuclei. Run with +experiment=xai/radboud.

activations_dir: ${out_dir}/activations
concept_dir: ${out_dir}/concepts/k16_seed1
codes: # only read
  l1: # the stored encoder codes κ
    validation: ${concept_dir}/morphometry/codes_validation.npy
    test: ${concept_dir}/codes_test.npy
  refit: # κ̃ of xai.refit_magnitudes
    validation: ${concept_dir}/refit_nnls/codes_refit_validation.npy
    test: ${concept_dir}/refit_nnls/codes_refit_test.npy
subsets_csv: ${concept_dir}/subsets/subsets.csv # the all-16 bottleneck of xai.concept_subsets (check)
epithelium_classes_test: ${concept_dir}/epithelium_separation/classes_test.npy # xai.epithelium_separation
deck_key: ${out_dir}/session/key.csv
stable_concepts: [A, B, C, D, E, F, G, H]
stable_indices: [0, 1, 2, 3, 4, 6, 8, 12] # asserted against the deck key
out_dir_removal: ${concept_dir}/bottleneck_removal

bootstrap: 1000 # slide-level resamples of the test slides, shared by all scores
batch: 6 # resamples per GPU pass (peak ≈ 4 full-length float64 (batch, n) tensors)
seed: 42
device: ${oc.decode:${oc.env:XAI_DEVICE,cuda}}
num_threads: ${oc.decode:${oc.env:XAI_THREADS,10}}

links: # recorded as tags
  sae_training_run_id: 4cf1db8f2cff4fef844426e57a387b99
  refit_magnitudes_run_id: 6532785defde40c7a9669fa4ff6c5774 # "XAI: SAE magnitude refit (NNLS)"
  epithelium_separation_run_id: 0b24e5db2f6e42d3b9c797af2b83a3de # the epithelial classes

metadata:
  run_name: "XAI: SAE bottleneck, single-concept removal (epithelium)"
  hyperparams:
    bootstrap: ${bootstrap}
    seed: ${seed}
