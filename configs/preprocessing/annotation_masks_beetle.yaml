# @package _global_

xmls_dir: ${project_path}/BEETLE/annotations/xmls
wsis_dir: ${project_path}/BEETLE/data/images/development/wsis

classes:
  - invasive epithelium
  - non-invasive epithelium
  - necrosis
  - other

level: 0
mask_tile_width: 512
mask_tile_height: 512
max_concurrent: 6
mlflow_artifact_path: annotation_masks

metadata:
  run_name: "🖍️ Annotation Masks: BEETLE"
  description: |
    Per-class annotation masks for the BEETLE dataset, generated from the ASAP XML
    annotations at `annotations/xmls`. A separate binary mask (255 = annotated region,
    0 = background) is written for each of the annotation classes: ${classes}.

    Slides with an XML annotation file but no matching WSI are logged in `missing_slides.csv`.
  hyperparams:
    level: ${level}
    mask_tile_width: ${mask_tile_width}
    mask_tile_height: ${mask_tile_height}
    classes: ${classes}
