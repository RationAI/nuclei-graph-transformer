# @package _global_

defaults:
  - /data/sources/icaird_cervix
  - _self_

metadata_uri: ${dataset.mlflow_uris.exploration}
annots_dir: ${dataset.paths.annotations}
mask_tile_width: ${dataset.mask_tile_width}
mask_tile_height: ${dataset.mask_tile_height}
level: 2
max_concurrent: 6

metadata:
  run_name: "🖍️ Carcinoma Annotation Masks: ${dataset.name}"
  description: |
    Carcinoma binary annotation masks for the [${dataset.name}]: regions classified 
        as "malignant" or "high grade", merged into a single class. Written for every 
        annotated slide.
  hyperparams:
    level: ${level}
    mask_tile_width: ${mask_tile_width}
    mask_tile_height: ${mask_tile_height}
