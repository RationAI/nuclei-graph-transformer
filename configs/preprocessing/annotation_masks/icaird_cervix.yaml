# @package _global_

defaults:
  - /data/sources/icaird_cervix
  - _self_

index_csv: ${dataset.paths.wsi_data.index_csv}
slides_dir: ${dataset.paths.wsi_data.slides_tif}
annots_dir: ${dataset.paths.annotations}
mask_tile_width: ${dataset.mask_tile_width}
mask_tile_height: ${dataset.mask_tile_height}
level: 2
max_concurrent: 6
mlflow_artifact_path: annotation_masks

metadata:
  run_name: "🖍️ Annotation Masks: ${dataset.name}"
  description: |
    Annotation Masks for the [${dataset.name}](https://www.icaird.com/).
    Encodes the most severe classification covering each pixel: 1 = low grade
    (CIN1/HPV), 2 = high grade (CIN2/CIN3), 3 = malignant. Slides in the
    "normal_inflammation" category have no lesion annotations and are skipped.
  hyperparams:
    level: ${level}
    mask_tile_width: ${mask_tile_width}
    mask_tile_height: ${mask_tile_height}
