# @package _global_

mlflow:
  tracking_uri: http://mlflow.rationai-mlflow:5000/

# Paths to the slides metadata parquet files generated by `preprocessing/metadata_mapping/prostate_cancer_mmci_tl.py`.
train_metadata_uri: mlflow-artifacts:/97/28a05b3cbc2a434eae6221f103d56020/artifacts/tile_level_annotations
test_metadata_uri: mlflow-artifacts:/97/28a05b3cbc2a434eae6221f103d56020/artifacts/tile_level_annotations_test

reporter:
  _target_: report.reporter.ReportAssembler
  title: "MMCI TL Test — Tile Predictions: Nuclei, CNN and ViT Foundation Models Comparison"
  metrics_run_ids:
    - 1ededb49107e414f853f4f60b03f5496 # virchow2 stain
    - 589d312de9fd4e20a21b5c8b70a193a4 # vgg-stain
    - 46c118d5c0314944a1809fbdc5a4cba3 # polygon + spatial embedding
  metrics_target_metrics:
    - accuracy
    - precision
    - recall
    - negative_predictive_value
    - specificity
    - AUC
  metrics_target_step: test
  template_asset_path: report_template.html

  save:
    _target_: report.save.MLFlowReportStorer
    artifact_path: report.html
    metadata:
      user: xrusnack
      experiment_name: Nuclei Graph — Transformer
      run_name: Report
      description: ""

  background:
    _target_: report.masks.ParquetSlideDatasetMLFlowMaskRetriever
    artifact_uris:
      #- ${train_metadata_uri}
      - ${test_metadata_uri}
    metadata_filename: slides_mapping.parquet
    item_path_col: slide_path
    item_name_col: slide_id
    ground_truth_col: is_carcinoma
    layer_name: Prostate WSI

  evaluation_runs:
    1ededb49107e414f853f4f60b03f5496:
      artifact_file: nested_metrics.json
      slide_item_key: key
    589d312de9fd4e20a21b5c8b70a193a4:
      artifact_file: nested_metrics.json
      slide_item_key: key
    46c118d5c0314944a1809fbdc5a4cba3:
      artifact_file: "slide_tile_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
      slide_item_key: "slide_id"

  mask_retrievers:
    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: cam_masks
      run_id: 23749f39b3f8451485a5c4bc75fd37bd
      layer_name: CAM (VGG-16 Stain)
      shader_conf:
        visible: True
        type: bipolar-heatmap
        params:
          threshold: 40
          opacity: 0.6
          colorHigh: "#00FF00" # green
          colorLow: "#FF0000" # red

    - _target_: report.masks.RunIDMlflowMaskRetriever
      shader_conf:
        type: heatmap
        params:
          use_mode: mask_clip
      run_id: 4ea7cee809a2443389855facba548959
      dir_name: tissue_masks
      layer_name: Tissue

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: annotation_masks
      run_id: fb2e33383e2548c48e5bd4f2a77e47a8
      layer_name: Annotation
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#1F971B"

    # - _target_: report.masks.RunIDMlflowMaskRetriever
    #   dir_name: heatmaps
    #   run_id: a40c5a17026840bea1828b78af46752d
    #   layer_name: Virchow2 Heatmap
    #   shader_conf:
    #     type: heatmap
    #     params:
    #       threshold: 85
    #     visible: True
    #     opacity: 0.80
    #     color: "#FFA500" # orange

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: heatmaps
      run_id: 1ededb49107e414f853f4f60b03f5496
      layer_name: "Virchow2 Stain"
      shader_conf:
        visible: False
        type: heatmap
        params:
          threshold: 80
        color: "#FFA500"

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: heatmaps
      run_id: 589d312de9fd4e20a21b5c8b70a193a4
      layer_name: "VGG-16 Stain"
      shader_conf:
        visible: False
        type: heatmap
        params:
          threshold: 96
        color: "#00FF00"

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: tile_heatmaps
      run_id: 46c118d5c0314944a1809fbdc5a4cba3
      layer_name: "Polygons + Spatial Embedding"
      shader_conf:
        visible: False
        type: heatmap
        params:
          threshold: 49
        color: "#0000FF" # blue 00FF00

metadata:
  run_name: Report — Nuclei Masks
  description: ""
