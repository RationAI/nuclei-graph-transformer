# @package _global_

mlflow:
  tracking_uri: https://mlflow.rationai.cloud.e-infra.cz/

# Paths to the folder with slides metadata parquet files generated by `preprocessing/metadata_mapping/panda.py`.
metadata_uri: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda

reporter:
  title: "PANDA Radboud Test — Nuclei model: Differences Between Modalities"
  metrics_run_ids: 
    - ca383cf16b414711b10b8ace1980e066 # polygons
    - 0946c406d23249ccaf5baab638cddab0 # texture
    - e2a24fb86854407f96d5cf6295259fa0 # blank token
  metrics_target_metrics:
    - nuclei_accuracy
    - nuclei_precision
    - nuclei_recall
    - nuclei_specificity
    - nuclei_AUROC
    - nuclei_AUPRC
  metrics_target_step: test_thresholded
  template_asset_path: report_template.html

  save:
    _target_: report.save.MLFlowReportStorer
    artifact_path: report.html
    metadata:
      user: xrusnack
      experiment_name: Nuclei Graph — Transformer
      run_name: Report
      description: ""

  evaluation_runs: 
    ca383cf16b414711b10b8ace1980e066:
      artifact_file: "slide_nuclei_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
      slide_item_key: "slide_id"
    0946c406d23249ccaf5baab638cddab0:
      artifact_file: "slide_nuclei_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
      slide_item_key: "slide_id"
    e2a24fb86854407f96d5cf6295259fa0:
      artifact_file: "slide_nuclei_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
      slide_item_key: "slide_id"

  background:
    _target_: report.masks.ParquetSlideDatasetMLFlowMaskRetriever
    artifact_uris:
      - ${metadata_uri}
    metadata_filename: slides_mapping_test.parquet # slides_mapping_train.parquet slides_mapping_test.parquet
    item_path_col: slide_path
    item_name_col: slide_id
    ground_truth_col: is_carcinoma
    layer_name: Prostate WSI

  mask_retrievers:
    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: carcinoma_mask
      run_id: cd504aaafb8c408184584d808a99cf15
      layer_name: Annotation
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#FF0000"
  
    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: prediction_masks
      run_id: ca383cf16b414711b10b8ace1980e066
      layer_name: "Shape"
      shader_conf:
        visible: False
        type: heatmap
        params:
          threshold: 44
        color: "#0000FF" # blue

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: prediction_masks
      run_id: 0946c406d23249ccaf5baab638cddab0
      layer_name: "Texture"
      shader_conf:
        visible: False
        type: heatmap
        params:
          threshold: 51
        color: "#FFA500" # orange

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: prediction_masks
      run_id: e2a24fb86854407f96d5cf6295259fa0
      layer_name: "Blank Token"
      shader_conf:
        visible: False
        type: heatmap
        params:
          threshold: 36
        color: "#000000" # black

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: prediction_diff_masks
      run_id: bf29bb938c7c47aeabfc4d21037af4c5
      layer_name: "Diff (Blank Token, Shape)"
      shader_conf:
        visible: False
        type: heatmap
        color: "#00FF00"  # green

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: prediction_diff_masks
      run_id: 5861d9f9ae7c4bccb682a02395d74f4c
      layer_name: "Diff (Blank Token, Texture)"
      shader_conf:
        visible: False
        type: heatmap
        color: "#00FF00"  # green

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: prediction_diff_masks
      run_id: 63efb2335075416aaa4e59ae501bc756
      layer_name: "Diff (Shape, Texture)"
      shader_conf:
        visible: False
        type: heatmap
        color: "#00FF00"  # green


metadata:
  run_name: Report — Nuclei Masks
  description: ""
