# @package _global_

mlflow:
  tracking_uri: https://mlflow.rationai.cloud.e-infra.cz/

# Paths to the folder with slides metadata parquet files generated by `preprocessing/metadata_mapping/panda.py`.
metadata_uri: mlflow-artifacts:/37/53cf24a94202486ca063607d5a588b34/artifacts/panda

reporter:
  title: PANDA Karolinska Train — Segmentation Polygons
  metrics_run_ids:
    #- 99ceb6a78a6047e3a64c0c49a82bcf96
  metrics_target_metrics:
    # - AUROC
    # - precision
    # - recall
  # metrics_target_step: test_thresholded
  template_asset_path: report_template.html

  save:
    _target_: report.save.MLFlowReportStorer
    artifact_path: report.html
    metadata:
      user: xrusnack
      experiment_name: Nuclei Graph — Transformer
      run_name: Report
      description: ""

  evaluation_runs:
    # 99ceb6a78a6047e3a64c0c49a82bcf96:
    #   artifact_file: "slide_nuclei_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
    #   slide_item_key: "slide_id"

  background:
    _target_: report.masks.ParquetSlideDatasetMLFlowMaskRetriever
    artifact_uris:
      - ${metadata_uri}
    metadata_filename: slides_mapping_train.parquet # slides_mapping_train.parquet slides_mapping_test.parquet
    item_path_col: slide_path
    item_name_col: slide_id
    ground_truth_col: is_carcinoma
    layer_name: Prostate WSI

  mask_retrievers:
    # - _target_: report.masks.RunIDMlflowMaskRetriever
    #   dir_name: carcinoma_mask
    #   run_id: 25c1a70a17d142fdaa12d399939c52a8
    #   layer_name: Annotation
    #   shader_conf:
    #     visible: True
    #     opacity: 0.5
    #     type: edge
    #     color: "#FF0000"

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: nuclei_masks
      run_id: da80bc53cfb14825b5dbbbea51c5e5eb
      layer_name: "Segmentation Polygon"
      shader_conf:
        visible: True
        type: heatmap
        params:
          threshold:
        color: "#00FF00"

metadata:
  run_name: Report — Nuclei Masks
  description: ""
