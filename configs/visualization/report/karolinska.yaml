# @package _global_

mlflow:
  tracking_uri: https://mlflow.rationai.cloud.e-infra.cz/

# Paths to the slides metadata parquet files generated by `preprocessing/metadata_mapping/panda.py`.
train_metadata_uri: mlflow-artifacts:/37/53cf24a94202486ca063607d5a588b34/artifacts/panda/slides_mapping_train.parquet
test_metadata_uri: mlflow-artifacts:/37/53cf24a94202486ca063607d5a588b34/artifacts/panda/slides_mapping_train.parquet

reporter:
  title: Annotation Masks — PANDA/Karolinska
  metrics_run_ids:
    - 843348978ac5456bba850b8e73108742
  metrics_target_metrics:
    # - AUROC
    # - precision
    # - recall
  metrics_target_step: test_thresholded
  template_asset_path: report_template.html

  save:
    _target_: report.save.MLFlowReportStorer
    artifact_path: report.html
    metadata:
      user: xrusnack
      experiment_name: Nuclei Graph — Transformer
      run_name: Report
      description: ""

  # evaluation_runs:
  #   843348978ac5456bba850b8e73108742:
  #     artifact_file: "slide_nuclei_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
  #     slide_item_key: "slide_id"

  background:
    _target_: report.masks.SlideRetriever
    paths:
      _target_: report.masks.mlflow_slide_retriever
      urls:
        - ${train_metadata_uri}
        - ${test_metadata_uri}
      key: "slide_path"
    layer_name: Prostate WSI

  mask_retrievers:
    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: carcinoma_mask
      run_id: cd504aaafb8c408184584d808a99cf15
      layer_name: Annotation
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#FF0000"

    # - _target_: report.masks.RunIDMlflowMaskRetriever
    #   dir_name: nuclei_masks
    #   run_id: 843348978ac5456bba850b8e73108742
    #   layer_name: "Polygon Embedding"
    #   shader_conf:
    #     visible: True
    #     type: heatmap
    #     params:
    #       threshold:
    #     color: "#00FF00"

metadata:
  run_name: Report — Nuclei Masks
  description: ""
