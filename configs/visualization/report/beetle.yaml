# @package _global_

mlflow:
  tracking_uri: http://mlflow.rationai-mlflow:5000/

# Generated by `python -m scripts.reporting.build_beetle_slides_metadata` from
# /mnt/projects/nuclei_based_wsi_analysis/BEETLE/data/images/development/wsis (WSIs) and
# /mnt/projects/nuclei_based_wsi_analysis/BEETLE/annotations/masks (annotation masks)
metadata_csv: /home/jovyan/nuclei-graph-transformer/data/beetle/slides_metadata.csv

# Run id of `preprocessing/annotation_masks_beetle.py`, which logs one binary mask per
# class (see `dir_name` below) to the `annotation_masks` artifact directory.
annotation_masks_run_id: ""

reporter:
  title: BEETLE Dataset—
  metrics_run_ids: 
    # - 843348978ac5456bba850b8e73108742
  metrics_target_metrics:
    # - AUROC
    # - precision
    # - recall
  # metrics_target_step: test_thresholded
  template_asset_path: report_template.html

  save:
    _target_: report.save.MLFlowReportStorer
    artifact_path: report.html
    metadata:
      user: xrusnack
      experiment_name: Nuclei Graph — Transformer
      run_name: Report
      description: ""

  evaluation_runs:
    # 843348978ac5456bba850b8e73108742:
    #   artifact_file: "slide_nuclei_metrics.json" #"slide_tile_metrics.json" "slide_nuclei_metrics.json"
    #   slide_item_key: "slide_id"

  background:
    _target_: report.masks.SlideRetriever
    paths:
      _target_: report.masks.csv_slide_retriever
      csv_path: ${metadata_csv}
      column: wsi_path
    layer_name: BEETLE WSI

  mask_retrievers:
    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: annotation_masks/invasive_epithelium
      run_id: ${annotation_masks_run_id}
      layer_name: "Invasive Epithelium"
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#FF0000"

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: annotation_masks/non-invasive_epithelium
      run_id: ${annotation_masks_run_id}
      layer_name: "Non-invasive Epithelium"
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#FFA500"

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: annotation_masks/necrosis
      run_id: ${annotation_masks_run_id}
      layer_name: "Necrosis"
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#800080"

    - _target_: report.masks.RunIDMlflowMaskRetriever
      dir_name: annotation_masks/other
      run_id: ${annotation_masks_run_id}
      layer_name: "Other"
      shader_conf:
        visible: True
        opacity: 0.5
        type: edge
        color: "#00FFFF"


metadata:
  run_name: Report — BEETLE dataset
  description: ""
