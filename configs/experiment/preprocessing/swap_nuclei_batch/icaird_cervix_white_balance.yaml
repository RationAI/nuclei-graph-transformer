# @package _global_

# Moves the white-balanced re-segmentation into `cervix/`; the replaced nuclei go to
# `cervix_replaced/`. Run with `dry_run=false` once the dry run's counts look right.
metadata_uri: ${dataset.mlflow_uris.resegmentation_white_balance}
source_batch: cervix_white_balance
target_batch: cervix
backup_batch: cervix_replaced

metadata:
  run_name: "Nuclei Batch Swap (white balance): ${dataset.name}"
