# @package _global_

# Re-segments the slides whose faint nuclei LSP-DETR missed, white balanced, into
# `nuclei_seg/cervix_white_balance/`; `preprocessing.swap_nuclei_batch` then moves them
# into `cervix/`, which the rest of the pipeline reads.
batch_name: cervix_white_balance

metadata_uris:
  - ${dataset.mlflow_uris.resegmentation_white_balance}

white_balance:
  glass_target: 240
  glass_min_value: 200
  max_side: 4000

metadata:
  run_name: "Nuclei Segmentation (white balance): ${dataset.name}"
