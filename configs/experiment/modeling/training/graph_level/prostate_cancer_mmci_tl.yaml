# @package _global_

defaults:
  - /experiment/modeling/training/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: graph_classification
  - /data/samplers@data.sampler: weighted_random_sampler
  - /data/supervision@data.supervision.train_strategy: annotation # dummy
  - /data/supervision@data.supervision.eval_strategy: annotation
  - _self_

monitor: validation/graph/loss

trainer:
  max_epochs: 150
  gradient_clip_val: 0.7
  #accumulate_grad_batches: 2

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 16
  k: 16
  split_stratify_col: "is_carcinoma"
  split_group_col: "patient_id"
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}

  dataset:
    crop_size_min: 512
    crop_size_max: 8192
    crop_pos_thr: 0.75
    alpha: 0.8
    efd_order: 16
    patch_size: 48
    embedding_mode: "bbox" # "efd", "bbox"
    random_rotate: true

  supervision:
    paths: ${dataset.paths.supervision}
  sampler:
    positivity_thr: 0.0
    pos_slide_ratio: 0.5

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      mil_mode: "embeddlogiting" # "embedding" "logit"
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Train(MMCI): Crop-level Classification, CNN nuclei bbox enc, logit pooling"
