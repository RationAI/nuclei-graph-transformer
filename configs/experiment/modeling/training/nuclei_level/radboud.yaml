# @package _global_

defaults:
  - /experiment/modeling/training/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/samplers@data.sampler: weighted_random_sampler
  - /data/supervision@data.supervision.train_strategy: annotation
  - /data/supervision@data.supervision.eval_strategy: annotation
  - _self_

monitor: validation/loss

trainer:
  max_epochs: 200
  gradient_clip_val: 0.7
  #accumulate_grad_batches: 2

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule

  batch_size: 32
  k: 16
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.radboud.metadata}

  dataset:
    crop_size_min: 512
    crop_size_max: 8192
    alpha: 0.8
    efd_order: 16
    patch_size: 48
    embedding_mode: "bbox" # "efd", "bbox", "spatial", "pos_only"
    random_rotate: true

  supervision:
    paths: ${dataset.providers.radboud.supervision}
  sampler:
    positivity_thr: 0.05
    pos_slide_ratio: 0.75

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      dim: 256
      hidden_dim: 1024
      # node_features: 8 # override for "spatial" embeddings
      # norm_dim: 8 # override for "spatial" embeddings
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Train(Radboud): NL Classifier, CNN BBox 48x48 + k-NN"
  description: ""
