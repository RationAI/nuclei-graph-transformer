# @package _global_

defaults:
  - /experiment/modeling/training/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/samplers@data.sampler: weighted_random_sampler
  - /data/augmentations@data.dataset.augmentations: base # spatial polygon_spatial base
  - /data/supervision@data.supervision.train_strategy: annotation
  - /data/supervision@data.supervision.eval_strategy: annotation
  - _self_

monitor: validation/loss
checkpoint_mode: min

trainer:
  max_epochs: 300
  gradient_clip_val: 0.7
  #accumulate_grad_batches: 2

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule

  batch_size: 32
  k: 16
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.radboud.metadata}

  dataset:
    crop_size_min: 512
    crop_size_max: 8192
    alpha: 0.8
    efd_order: 16
    patch_size: 48
    embedding_mode: "blank" # "efd", "bbox", "pointnet", "efd_pointnet", "spatial", "efd_spatial", "blank"

  supervision:
    paths: ${dataset.providers.radboud.supervision}
  sampler:
    positivity_thr: 0.05
    pos_slide_ratio: 0.75

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      dim: 256
      hidden_dim: 1024
      # node_features: 5 # override for "spatial" embeddings
      # norm_dim: 5 # override for "spatial" embeddings
      # norm_dim: ${add:${mul:4,${data.dataset.efd_order}},6} # override for "efd_spatial" embeddings
      # node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Radboud, k=16: Blank Token + k-NN Attn"
  description: ""
