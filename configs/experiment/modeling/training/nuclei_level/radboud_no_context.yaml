# @package _global_

# Feature-only baseline: same encoder, but each nucleus attends only to itself
# (attention reduces to W_o W_v x, i.e. a per-nucleus MLP) and no RoPE.

defaults:
  - /experiment/modeling/training/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/samplers@data.sampler: weighted_random_sampler
  - /data/augmentations@data.dataset.augmentations: base # spatial polygon_spatial base
  - /data/supervision@data.supervision.train_strategy: annotation
  - /data/supervision@data.supervision.eval_strategy: annotation
  - _self_

monitor: validation/loss
checkpoint_mode: min

trainer:
  max_epochs: 300
  gradient_clip_val: 0.7

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 16
  k: 44 # unused by the model when context=none
  context: none # none, dense, knn
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.radboud.metadata}

  dataset:
    crop_size_min: 512
    crop_size_max: 8192
    alpha: 0.8
    efd_order: 16
    patch_size: 48
    embedding_mode: "bbox" # "efd" (shape) or "bbox" (texture)

  supervision:
    paths: ${dataset.providers.radboud.supervision}
  sampler:
    positivity_thr: 0.05
    pos_slide_ratio: 0.75

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      attention_variant: standard # none-context requires standard
      embedding_mode: ${data.dataset.embedding_mode}
      context: ${data.context}
      use_rope: false

metadata:
  run_name: "Radboud: CNN Bboxes 48x48 + No Context (per-nucleus MLP)"

