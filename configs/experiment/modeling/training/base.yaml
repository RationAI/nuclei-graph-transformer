# @package _global_

mode: fit

monitor: ???
checkpoint_mode: ???

trainer:
  accumulate_grad_batches: 1
  gradient_clip_val: null
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 1
      monitor: ${monitor}
      mode: ${checkpoint_mode}

data:
  block_size: 128
  split_size: ???
  split_stratify_col: ???
  split_group_col: ???
  supervision:
    train_strategy: ???

model:
  net:
    config:
      efd_order: ${data.dataset.efd_order}
      embedding_mode: ??? # "efd", "bbox", "spatial", "efd_spatial", "blank"
      node_features: ${add:${mul:4,${data.dataset.efd_order}},3} # efd_order * 4 + scale + sin/cos angles
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},1} # efd_order * 4 + scale
      num_classes: 1

metadata:
  run_name: ???
  hyperparams:
    # supervision
    train_supervision_mode: ${data.supervision.train_strategy.mode}
    validation_supervision_mode: ${data.supervision.eval_strategy.mode}

    # sampler
    sampler_positivity_threshold: ${oc.select:data.sampler.positivity_thr,null}
    sampler_pos_slide_ratio: ${oc.select:data.sampler.pos_slide_ratio,null}
    sampler_replacement: ${oc.select:data.sampler.replacement,null}

    # training
    gradient_clip_val: ${trainer.gradient_clip_val}
    accumulate_grad_batches: ${trainer.accumulate_grad_batches}
    batch_size: ${data.batch_size}
    split_size: ${data.split_size}

    # data
    crop_size_min: ${oc.select:data.dataset.crop_size_min,null}
    crop_size_max: ${oc.select:data.dataset.crop_size_max,null}
    alpha: ${oc.select:data.dataset.alpha,null}
    k: ${oc.select:data.k,null}
    efd_order: ${oc.select:data.dataset.efd_order,null}

    # model
    lr: ${model.lr}
    warmup_epochs: ${model.warmup_epochs}
    dim: ${model.net.config.dim}
    hidden_dim: ${model.net.config.hidden_dim}
    k_neighbors: ${oc.select:model.net.config.k_neighbors, null}
    num_heads: ${model.net.config.num_heads}
    num_layers: ${model.net.config.num_layers}
    drop_path_rate: ${model.net.config.drop_path_rate}
    embedding_mode: ${model.net.config.embedding_mode}
