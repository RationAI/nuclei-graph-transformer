# @package _global_

defaults:
  - /experiment/modeling/testing/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/tile@data.dataset: classification
  - /data/supervision@data.supervision.eval_strategy: annotation # dummy
  - _self_

checkpoint: mlflow-artifacts:/97/2ec2a07ee62943cfa6a1cb9ebaaa7458/artifacts/checkpoints/epoch=188-step=3780/checkpoint.ckpt

mlflow_run_id: 1477005785554e9f9c51b377b6c52818
mlflow_parent_run_id: 2ec2a07ee62943cfa6a1cb9ebaaa7458

data:
  _target_: nuclei_graph.data.datamodules.tile.TileDataModule

  batch_size: 32
  k: 16
  metadata: ${dataset.mlflow_uris.metadata}

  dataset:
    uris: ${dataset.mlflow_uris.tiles.512.test}
    tile_size: 512
    margin: 128
    efd_order: 16
    embedding_mode: "bbox" # "efd", "bbox", "spatial", "efd_spatial", "blank"
    carcinoma_filter: false

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "📊 Evaluation (MMCI)"
