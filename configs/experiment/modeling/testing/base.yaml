# @package _global_

defaults:
  - /callbacks/parent_run@trainer.callbacks.parent_run_tag
  - _self_

mode: test

checkpoint: ???

trainer:
  callbacks: {}

data:
  batch_size: 1
  block_size: 128
  supervision:
    train_strategy: null

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      efd_order: ${data.dataset.efd_order}
      embedding_mode: ??? # "efd", "bbox", "spatial", "pos_only"
      node_features: ${add:${mul:4,${data.dataset.efd_order}},3} # efd_order * 4 + scale + sin/cos angles
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},1} # efd_order * 4 + scale
      num_classes: 1

metadata:
  run_name: ???
  hyperparams:
    testing_supervision_mode: ${data.supervision.eval_strategy.mode}
    embedding_mode: ${model.net.config.embedding_mode}
