# @package _global_

defaults:
  - /experiment/modeling/testing/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation prediction
  #- /callbacks@trainer.callbacks.position_importances: position_importance
  - _self_

checkpoint: mlflow-artifacts:/97/bfb5f7a1a4724bf983c6d39bcb84a616/artifacts/checkpoints/epoch=284-step=12825/checkpoint.ckpt

mlflow_run_id: 1be290dbc0104625b83765ed25ff3145
mlflow_parent_run_id: bfb5f7a1a4724bf983c6d39bcb84a616

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 24 # unused by the model when context={none, dense}
  context: knn # none, dense, knn

  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 16
    patch_size: 40
    embedding_mode: efd # efd, bbox, blank
  supervision:
    paths: ${dataset.paths.supervision}
    eval_strategy:
      # Final MMCI rule: Another pathology and Exclude nuclei ignored at test, matching the tile level
      # (every tile touching either is dropped), as in training and validation; preprocessing/ignore_labels_mmci.py.
      # Variants: ignore_dir=${data.supervision.paths.another_pathology} (Another pathology only,
      # Exclude 0) or ignore_dir=null (both labelled 0, the pipeline's dense rule).
      ignore_dir: ${data.supervision.paths.another_exclude}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "MMCI: NL Testing"
