# @package _global_

defaults:
  - /experiment/modeling/testing/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei_wsl
  - /model/models@model.net: self_attn_transformer
  - /data/datasets@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation prediction
  #- /callbacks@trainer.callbacks.feature_importances: feature_importances
  - /callbacks@trainer.callbacks.spatial_permutation_importance: spatial_permutation_importance
  - _self_

checkpoint: mlflow-artifacts:/97/6ba361aa4280480fb5ff668dc11dba3b/artifacts/checkpoints/epoch=323-step=28836/checkpoint.ckpt
checkpoint_url: https://mlflow.rationai.cloud.trusted.e-infra.cz/#/experiments/97/runs/6ba361aa4280480fb5ff668dc11dba3b

data:
  k: 16
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 15
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15

metadata:
  run_name: "Permutation Importances(MMCI): Nucleus-level Classifier, Polygons + Positions (RoPE) + k-NN Attn"
  description: "[MLflow training run](${checkpoint_url})"
