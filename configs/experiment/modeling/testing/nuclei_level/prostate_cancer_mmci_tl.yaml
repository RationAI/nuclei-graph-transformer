# @package _global_

defaults:
  - /experiment/modeling/testing/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei_wsl
  - /model/models@model.net: self_attn_transformer
  - /data/datasets@data.dataset: nuclei_dataset
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation prediction
  - /callbacks@trainer.callbacks.feature_importances: feature_importances
  - _self_

checkpoint: mlflow-artifacts:/97/27bacc7d5de645e29eab8d57b5bb63f8/artifacts/checkpoints/epoch=273-step=6028/checkpoint.ckpt
checkpoint_url: https://mlflow.rationai.cloud.trusted.e-infra.cz/#/experiments/97/runs/27bacc7d5de645e29eab8d57b5bb63f8

data:
  k: 16
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    alpha: 0.8
    efd_order: 15
    crop_size: 4096
    mil: false
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15

metadata:
  run_name: "Feature Importances(MMCI): Local Classifier"
  description: "[MLflow training run](${checkpoint_url})"
