# @package _global_

defaults:
  - /experiment/modeling/testing/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks@trainer.callbacks.feature_importances: feature_importances
  - _self_

checkpoint: mlflow-artifacts:/97/77aac2970ef54a2b9fab6d3238585d4f/artifacts/checkpoints/epoch=321-step=7084/checkpoint.ckpt

mlflow_run_id: null
mlflow_parent_run_id: null

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 32
  metadata: ${dataset.providers.radboud.metadata}
  dataset:
    efd_order: 15
    patch_size: 48
    embedding_mode: "efd" # "efd", "bbox"
  supervision:
    paths: ${dataset.providers.radboud.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "📊 Evaluation (MMCI)"
