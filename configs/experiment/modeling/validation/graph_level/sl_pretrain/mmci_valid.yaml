# @package _global_
# Thresholds of an sl_pretrain model on MMCI valid (the fixed split of the MMCI train table, 84
# slides, as in training): CropCurvesCallback logs thresholds/val_graph_j (slide, Youden), used by
# metrics/sl_pretrain/mmci_test. For the fine-tuned (mmci_finetune_from_panda) and scratch
# (mmci_sl_scratch_same_arch) runs; mmci_zeroshot_from_panda sets the PANDA checkpoint.

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: graph_classification
  - /data/supervision@data.supervision.eval_strategy: annotation_sparse
  - /callbacks/plot_curves@trainer.callbacks.thresholds: crop
  - /experiment/modeling/validation/graph_level/sl_pretrain/_arch@_here_
  - _self_

checkpoint: ??? # mlflow-artifacts:/97/<training run>/artifacts/checkpoints/last/checkpoint.ckpt
mlflow_run_id: null
mlflow_parent_run_id: ??? # the training run

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  split_stratify_col: is_carcinoma
  split_group_col: patient_id
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    full_slide: true
  supervision:
    paths: ${dataset.paths.supervision}
    eval_strategy:
      ignore_dir: ${data.supervision.paths.another_exclude}

metadata:
  run_name: "SL pretrain: MMCI valid thresholds"
