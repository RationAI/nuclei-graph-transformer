# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: graph_classification
  - /data/supervision@data.supervision.eval_strategy: annotation_sparse
  - /callbacks/plot_curves@trainer.callbacks.thresholds: crop
  - _self_

checkpoint: mlflow-artifacts:/97/a17cf19cfd6b4465a1e9119c02dd37a0/artifacts/checkpoints/epoch=152-step=6885/checkpoint.ckpt
mlflow_run_id: 5e0feb6448884ac484fb4114419f6317
mlflow_parent_run_id: a17cf19cfd6b4465a1e9119c02dd37a0

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 44
  split_stratify_col: is_carcinoma
  split_group_col: patient_id
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: efd # efd, bbox, blank
    full_slide: true
  supervision:
    paths: ${dataset.paths.supervision
    eval_strategy:
      ignore_dir: ${data.supervision.paths.another_pathology}

model:
  net:
    config:
      dim: 128
      hidden_dim: 512
      num_heads: 4
      num_layers: 4
      drop_path_rate: 0.25
      attention_variant: vrope # vrope, standard, rel_value
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Radboud: SL Evaluation"
