# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: graph_classification
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/plot_curves@trainer.callbacks.thresholds: crop
  - _self_

checkpoint: # TODO

mlflow_run_id: null
mlflow_parent_run_id: null

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 64
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 10
  supervision:
    paths: ${dataset.providers.radboud.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.30
      mil_mode: "logit" # embedding logit

metadata:
  run_name: "📊 Evaluation (Radboud)"
