# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/plot_curves@trainer.callbacks.thresholds: nuclei
  - _self_

checkpoint: mlflow-artifacts:/37/17b6b957cb3a4321a3aeaec0000a9db1/artifacts/checkpoints/epoch=146-step=35868/checkpoint.ckpt
mlflow_run_id: bada53a9f4ed485889e51040a20bff5f
mlflow_parent_run_id: 17b6b957cb3a4321a3aeaec0000a9db1

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 24
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.karolinska.metadata}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: "efd" # "efd", "bbox", "spatial", "efd_spatial"
  supervision:
    paths: ${dataset.providers.karolinska.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      # node_features: 5 # override for "spatial" embeddings
      # norm_dim: 5 # override for "spatial" embeddings
      # norm_dim: ${add:${mul:4,${data.dataset.efd_order}},6} # override for "efd_spatial" embeddings
      # node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      attention_variant: standard # standard, vrope, rel_value
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Karolinska: Threshold Estimation"
