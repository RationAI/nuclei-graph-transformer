# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation agreement
  - /callbacks/plot_curves@trainer.callbacks.thresholds: nuclei
  - _self_

checkpoint: mlflow-artifacts:/97/165e61bac286468cb78f737649e39588/artifacts/checkpoints/epoch=237-step=21420/checkpoint.ckpt

mlflow_run_id: null
mlflow_parent_run_id: 165e61bac286468cb78f737649e39588

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 16
  split_stratify_col: "is_carcinoma"
  split_group_col: "patient_id"
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 15
    patch_size: 48
    embedding_mode: "bbox" # "efd", "bbox", "spatial", "pos_only"
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "📊 Evaluation (MMCI)"
