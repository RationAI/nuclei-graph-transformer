# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei_wsl
  - /model/models@model.net: self_attn_transformer
  - /data/datasets@data.dataset: nuclei_dataset
  - /data/supervision@data.supervision.eval_strategy: agreement
  - /callbacks/plot_curves@trainer.callbacks.thresholds: wsl
  - _self_

checkpoint: mlflow-artifacts:/97/80306a6b7edc40e29a6d5136f8b1340b/artifacts/checkpoints/epoch=281-step=6204/checkpoint.ckpt
checkpoint_url: https://mlflow.rationai.cloud.trusted.e-infra.cz/#/experiments/97/runs/80306a6b7edc40e29a6d5136f8b1340b

data:
  batch_size: 1
  k: 16
  split_stratify_col: "is_carcinoma"
  split_group_col: "patient_id"
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 15
    mil: false
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15

metadata:
  run_name: "📊 Threshold Estimation(MMCI): Nucleus-level Classifier, Polygons + Positions (absolute) + k-NN Attn"
