checkpoint: mlflow-artifacts:/97/06f14867b749416d8985873f752b1409/artifacts/checkpoints/epoch=205-step=9270/checkpoint.ckpt

mlflow_run_id: b1f34ae2a5904afaa6917d4e8bd5a56d
