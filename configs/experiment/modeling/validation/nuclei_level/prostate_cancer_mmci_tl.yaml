# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: agreement
  - /callbacks/plot_curves@trainer.callbacks.thresholds: nuclei
  #- /callbacks@trainer.callbacks.shape_permutation_importance: shape_features_permutation_importances
  - _self_

checkpoint: mlflow-artifacts:/97/742e6b8596804bbabe111fda99eb4835/artifacts/checkpoints/epoch=229-step=10350/checkpoint.ckpt
mlflow_run_id: 376525eefc8b4929a158dd20473a7d6e
mlflow_parent_run_id: 742e6b8596804bbabe111fda99eb4835

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 44 # unused by the model when context={none, dense}
  context: knn # none, dense, knn

  split_stratify_col: is_carcinoma
  split_group_col: patient_id
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: efd # efd, bbox, blank
  supervision:
    paths: ${dataset.paths.supervision}
    eval_strategy:
      ignore_dir: ${data.supervision.paths.another_pathology}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      attention_variant: standard # standard, vrope, rel_value
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "MMCI: Treshold Estimation"
