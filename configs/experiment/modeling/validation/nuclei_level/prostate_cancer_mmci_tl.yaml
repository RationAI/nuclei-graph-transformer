# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: agreement
  - /callbacks/plot_curves@trainer.callbacks.thresholds: nuclei
  - _self_

checkpoint: mlflow-artifacts:/97/231deb8a94124e39b0838e184cc80c7c/artifacts/checkpoints/epoch=256-step=11565/checkpoint.ckpt

mlflow_run_id: c468689e30ff470e9f60675c0eb38ab6
mlflow_parent_run_id: 231deb8a94124e39b0838e184cc80c7c

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 16
  split_stratify_col: "is_carcinoma"
  split_group_col: "patient_id"
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: "spatial" # "efd", "bbox", "spatial", "pos_only", "efd_spatial"
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024

      node_features: 9 # override for "spatial" embeddings
      norm_dim: 9 # override for "spatial" embeddings
      # norm_dim: ${add:${mul:4,${data.dataset.efd_order}},10} # override for "efd_spatial" embeddings
      # node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings

      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "NL Test (MMCI) Evaluation: Annotations"
