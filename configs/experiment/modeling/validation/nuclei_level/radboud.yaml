# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/plot_curves@trainer.callbacks.thresholds: nuclei
  - _self_

checkpoint: mlflow-artifacts:/37/d9728e73e2874ef9a6f1537c7f28c13d/artifacts/checkpoints/epoch=137-step=30084/checkpoint.ckpt
mlflow_run_id: 3269180884ad4b0285dfb76793bf791f
mlflow_parent_run_id: d9728e73e2874ef9a6f1537c7f28c13d

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 24 # unused by the model when context={none, dense}
  context: knn # none, dense, knn
  
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.radboud.metadata}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: efd # efd, bbox, blank
  supervision:
    paths: ${dataset.providers.radboud.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      attention_variant: standard # standard, vrope, rel_value
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Radboud: Threshold Estimation"
