# @package _global_

defaults:
  - /experiment/modeling/validation/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: nuclei_classification
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/plot_curves@trainer.callbacks.thresholds: nuclei
  - _self_

checkpoint: mlflow-artifacts:/37/4147dd723875428fa5eec1012c621c31/artifacts/checkpoints/epoch=98-step=10791/checkpoint.ckpt

mlflow_run_id: 01fb5fc91b064f2c8ddbf6db756b5ac0
mlflow_parent_run_id: 4147dd723875428fa5eec1012c621c31

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  batch_size: 1
  k: 32
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.radboud.metadata}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: "efd_spatial" # "efd", "bbox", "spatial", "pos_only", "efd_spatial"
  supervision:
    paths: ${dataset.providers.radboud.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      
      # node_features: 9 # override for "spatial" embeddings
      # norm_dim: 9 # override for "spatial" embeddings
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},10} # override for "efd_spatial" embeddings
      node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings

      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "NL Test (Radboud) Threshold Estimation"
