defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/icaird_cervix
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation_sparse 
  - /callbacks/predictions@trainer.callbacks.predictions: nuclei
  - /callbacks/masks@trainer.callbacks.nuclei_masks: nuclei
  - _self_


checkpoint: ??? 
mlflow_run_id: null
mlflow_parent_run_id: ??? 

trainer:
  callbacks:
    nuclei_masks:
      level: 1

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 24 
  context: knn # none, dense, knn

  metadata:
    predict: ${dataset.mlflow_uris.metadata.test}
  dataset:
    efd_order: 16
    patch_size: 40 # unused with efd
    embedding_mode: efd # efd, bbox, blank
  supervision:
    paths:
      annotation: ${dataset.paths.supervision.reannotation}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      use_rope: true
      attention_variant: vrope # rotated values (RoVE)
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "iCAIRD: NL Evaluation"
