# @package _global_

defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation prediction
  - /callbacks/predictions@trainer.callbacks.predictions: nuclei
  - /callbacks/masks@trainer.callbacks.nuclei_masks: nuclei
  - _self_

checkpoint: mlflow-artifacts:/97/20bc7792b5db4316a622185cd59bca6b/artifacts/checkpoints/epoch=865-step=38970/checkpoint.ckpt
mlflow_run_id: null
mlflow_parent_run_id: 20bc7792b5db4316a622185cd59bca6b

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 40
  metadata:
    predict: ${dataset.mlflow_uris.metadata.test}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: "blank" # "efd", "bbox", "spatial", "efd_spatial"
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      # node_features: 5 # override for "spatial" embeddings
      # norm_dim: 5 # override for "spatial" embeddings
      # norm_dim: ${add:${mul:4,${data.dataset.efd_order}},6} # override for "efd_spatial" embeddings
      # node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      attention_variant: vrope # standard, vrope, rel_value
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "MMCI: NL Evaluation"
