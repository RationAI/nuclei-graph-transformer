# @package _global_

defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation prediction
  - /callbacks/predictions@trainer.callbacks.predictions: nuclei
  #- /callbacks/masks@trainer.callbacks.nuclei_masks: nuclei
  - _self_

checkpoint: mlflow-artifacts:/97/6ba361aa4280480fb5ff668dc11dba3b/artifacts/checkpoints/epoch=323-step=28836/checkpoint.ckpt
checkpoint_url: https://mlflow.rationai.cloud.trusted.e-infra.cz/#/experiments/97/runs/6ba361aa4280480fb5ff668dc11dba3b

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 16
  metadata:
    predict: ${dataset.mlflow_uris.metadata.test}
  dataset:
    efd_order: 15
  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15

metadata:
  run_name: "📊 Predictions(MMCI): Nucleus-level Classifier, Polygons + Positions (RoPE) + k-NN Attn"
  description: "Predictions: [MLflow training run](${checkpoint_url})"
