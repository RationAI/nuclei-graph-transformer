# @package _global_

defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/predictions@trainer.callbacks.predictions: nuclei
  - /callbacks/masks@trainer.callbacks.nuclei_masks: nuclei
  - _self_

checkpoint: mlflow-artifacts:/37/4592ad8adea1495cbb9e44af23983643/artifacts/checkpoints/epoch=134-step=14715/checkpoint.ckpt
mlflow_run_id: null
mlflow_parent_run_id: 4592ad8adea1495cbb9e44af23983643

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 4
  metadata:
    predict: ${dataset.providers.radboud.metadata.test}
  dataset:
    efd_order: 16
    patch_size: 48
    embedding_mode: "efd_spatial" # "efd", "bbox", "spatial", "pos_only", "efd_spatial"
  supervision:
    paths: ${dataset.providers.radboud.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024

      # node_features: 9 # override for "spatial" embeddings
      # norm_dim: 9 # override for "spatial" embeddings
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},10} # override for "efd_spatial" embeddings
      node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings

      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "NL Test (Radboud) Evaluation: Annotations"
