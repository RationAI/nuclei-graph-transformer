# @package _global_

defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/predictions@trainer.callbacks.predictions: nuclei
  - /callbacks/masks@trainer.callbacks.nuclei_masks: nuclei
  - _self_

checkpoint: mlflow-artifacts:/37/37b4969170eb475ab629a1f816fb3181/artifacts/checkpoints/epoch=147-step=36112/checkpoint.ckpt
mlflow_run_id: null
mlflow_parent_run_id: 37b4969170eb475ab629a1f816fb3181

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 32 # unused by the model when context={none, dense}
  context: knn # none, dense, knn
  
  metadata:
    predict: ${dataset.providers.karolinska.metadata.test}
  dataset:
    efd_order: 16
    patch_size: 40
    embedding_mode: efd # efd, bbox, blank
  supervision:
    paths: ${dataset.providers.karolinska.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.15
      attention_variant: standard # standard, vrope, rel_value
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "Karolinska: NL Evaluation"
