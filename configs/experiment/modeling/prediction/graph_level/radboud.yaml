# @package _global_

defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/panda
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/crop@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation
  - /callbacks/predictions@trainer.callbacks.predictions: crop # graph-level and nuclei-level preds
  - /callbacks/masks@trainer.callbacks.nuclei_masks: nuclei
  - /callbacks/masks@trainer.callbacks.attn_masks: attention
  - _self_

checkpoint: # TODO

mlflow_run_id: null
mlflow_parent_run_id: null

data:
  _target_: nuclei_graph.data.datamodules.crop.CropDataModule
  k: 16
  metadata:
    predict: ${dataset.providers.radboud.metadata.test}
  dataset:
    efd_order: 16
    #patch_size: 48
  supervision:
    paths: ${dataset.providers.radboud.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.30
      mil_mode: "logit" # embedding logit
      embedding_mode: "efd" # "efd", "bbox", "both"

metadata:
  run_name: "📊 Evaluation (Radboud)"
