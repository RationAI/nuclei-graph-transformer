# @package _global_

defaults:
  - /experiment/modeling/prediction/base@_here_
  - /data/sources/prostate_cancer_mmci_tl
  - /model/meta_archs@model: crop
  - /model/models@model.net: self_attn_transformer
  - /data/datasets/tile@data.dataset: prediction
  - /data/supervision@data.supervision.eval_strategy: annotation # annotation prediction
  - /callbacks/predictions@trainer.callbacks.predictions: tile
  - _self_

checkpoint: mlflow-artifacts:/97/3b4bd9d620744470a7aa096bc58f0e63/artifacts/checkpoints/epoch=304-step=6710/checkpoint.ckpt

mlflow_run_id: null
mlflow_parent_run_id: 3b4bd9d620744470a7aa096bc58f0e63

data:
  _target_: nuclei_graph.data.datamodules.tile.TileDataModule

  batch_size: 32
  k: 16

  metadata:
    predict: ${dataset.mlflow_uris.metadata.test}

  dataset:
    uris: ${dataset.mlflow_uris.tiles.512.test} # ${dataset.mlflow_uris.tiles.512.test} ${dataset.mlflow_uris.tiles.224.test}
    tile_size: 512 # 512 224
    margin: 128 # 128 56
    efd_order: 16
    embedding_mode: "efd" # "efd", "bbox", "spatial", "efd_spatial", "blank"

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

  supervision:
    paths: ${dataset.paths.supervision}

model:
  net:
    config:
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      drop_path_rate: 0.25
      embedding_mode: ${data.dataset.embedding_mode}

metadata:
  run_name: "📊 Tile-level Evaluation (MMCI)"
