# @package _global_

defaults:
  - /data/sources/panda
  - /data/datasets/tile@data.dataset: classification
  - /data/supervision@data.supervision.eval_strategy: agreement
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - _self_

data:
  k: 16
  split_stratify_col: "gleason_score"
  split_group_col: null
  split_size: 0.1
  metadata: ${dataset.providers.radboud.metadata}

  dataset:
    metadata: ${dataset.providers.radboud.tiles.224.train} # ${dataset.providers.radboud.tiles.512.train} ${dataset.providers.radboud.tiles.224.train}
    tile_size: 224 # 512 224
    margin: 56 # 128 56
    efd_order: 16
    embedding_mode: "efd" # "efd", "bbox", "spatial", "pos_only"

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

  supervision:
    paths: ${dataset.providers.radboud.supervision}
    train_strategy: null

patch_size: 48

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      efd_order: ${data.dataset.efd_order}
      node_features: ${add:${mul:4,${data.dataset.efd_order}},3} # efd_order * 4 + scale + sin/cos angles
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},1} # efd_order * 4 + scale
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      num_classes: 1
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

mlflow_run_id: null
mlflow_parent_run_id: 0ef3b54920e3428a9933dae1e0eeeac9

checkpoint: mlflow-artifacts:/37/0ef3b54920e3428a9933dae1e0eeeac9/artifacts/checkpoints/epoch=121-step=13298/checkpoint.ckpt
