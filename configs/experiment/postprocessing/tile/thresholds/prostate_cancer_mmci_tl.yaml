# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: classification
  - /data/supervision@data.supervision.eval_strategy: agreement
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - _self_

data:
  k: 32
  split_stratify_col: "is_carcinoma"
  split_group_col: "patient_id"
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}

  dataset:
    uris: ${dataset.mlflow_uris.tiles.224.train} # ${dataset.mlflow_uris.tiles.512.train} ${dataset.mlflow_uris.tiles.224.train}
    tile_size: 224 # 512 224
    margin: 56 # 128 56
    efd_order: 16
    embedding_mode: "efd_spatial" # "efd", "bbox", "pointnet", "efd_pointnet", "spatial", "efd_spatial"

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

  supervision:
    paths: ${dataset.paths.supervision}
    train_strategy: null

patch_size: 48

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      efd_order: ${data.dataset.efd_order}
      # node_features: 5 # override for "spatial" embeddings
      # norm_dim: 5 # override for "spatial" embeddings
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},6} # override for "efd_spatial" embeddings
      node_features: ${add:${model.net.config.norm_dim},2} # override for "efd_spatial" embeddings
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      num_classes: 1
      drop_path_rate: 0.15
      embedding_mode: ${data.dataset.embedding_mode}

mlflow_run_id: null
mlflow_parent_run_id: d8375c44a0a14533b03a3be72d49ddad

checkpoint: mlflow-artifacts:/97/d8375c44a0a14533b03a3be72d49ddad/artifacts/checkpoints/epoch=310-step=13995/checkpoint.ckpt
