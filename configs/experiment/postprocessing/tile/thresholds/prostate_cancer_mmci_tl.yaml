# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: classification
  - /data/supervision@data.supervision.eval_strategy: agreement
  - /model/meta_archs@model: nuclei
  - /model/models@model.net: self_attn_transformer
  - _self_

data:
  _target_: nuclei_graph.data.datamodules.tile.TileDataModule

  batch_size: 1
  num_workers: 0
  eval_num_workers: 0
  block_size: 128

  k: 16
  split_stratify_col: "is_carcinoma"
  split_group_col: "patient_id"
  split_size: 0.1
  metadata: ${dataset.mlflow_uris.metadata}

  dataset:
    uris: ${dataset.mlflow_uris.tiles.train}
    tile_size: 512
    margin: 128
    efd_order: 15

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

  supervision:
    paths: ${dataset.paths.supervision}
    train_strategy: null

patch_size: 48 # bbox nuclei embeddings for the nuclei prediction pass

model:
  lr: 1e-4
  warmup_epochs: 8
  net:
    config:
      efd_order: ${data.dataset.efd_order}
      node_features: ${add:${mul:4,${data.dataset.efd_order}},3} # efd_order * 4 + scale + sin/cos angles
      norm_dim: ${add:${mul:4,${data.dataset.efd_order}},1} # efd_order * 4 + scale
      dim: 256
      hidden_dim: 1024
      num_heads: 8
      num_layers: 8
      num_classes: 1
      drop_path_rate: 0.15
      embedding_mode: "bbox" # "efd", "bbox", "both"

mlflow_run_id: null
mlflow_parent_run_id: 165e61bac286468cb78f737649e39588

checkpoint: mlflow-artifacts:/97/165e61bac286468cb78f737649e39588/artifacts/checkpoints/epoch=237-step=21420/checkpoint.ckpt
