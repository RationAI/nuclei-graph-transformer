# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: prediction
  - _self_

metadata_uri: ${dataset.mlflow_uris.metadata.test}
nuclei_predictions_uri: mlflow-artifacts:/97/3eb35a6fb8874727bc25737e4924625c/artifacts/predictions
pooling_mode: top_k
pooling_k: 24

data:
  dataset:
    uris: ${dataset.mlflow_uris.tiles.test}
    tile_size: 512
    margin: 128
    efd_order: 15
    embedding_mode: "bbox" # "efd", "bbox", "spatial", "pos_only"

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

mlflow_run_id: 0e8d56ce2a8048ab9895884137df7d4e
mlflow_parent_run_id: 165e61bac286468cb78f737649e39588
