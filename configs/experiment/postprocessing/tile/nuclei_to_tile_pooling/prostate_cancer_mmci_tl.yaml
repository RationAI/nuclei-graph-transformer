# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: prediction
  - _self_

metadata_uri: ${dataset.mlflow_uris.metadata.test}
nuclei_predictions_uri: mlflow-artifacts:/97/cb91e7d320404d66a1dbae4d161f537e/artifacts/predictions
pooling_mode: top_k
pooling_k: 24

data:
  dataset:
    uris: ${dataset.mlflow_uris.tiles.512.test}
    tile_size: 512
    margin: 128
    efd_order: 15
    embedding_mode: "bbox" # "efd", "bbox", "spatial", "pos_only"

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

mlflow_run_id: d71f75b79814443c872f14981ffa3233
