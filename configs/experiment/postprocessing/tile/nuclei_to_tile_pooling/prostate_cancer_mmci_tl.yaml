# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: prediction
  - _self_

metadata_uri: ${dataset.mlflow_uris.metadata.test}
nuclei_predictions_uri: mlflow-artifacts:/97/8b1a14c68b4943f79cba5271f1ca3f1b/artifacts/predictions
pooling_mode: max
pooling_k: null

data:
  dataset:
    uris: ${dataset.mlflow_uris.tiles.224.test} # ${dataset.mlflow_uris.tiles.512.test} ${dataset.mlflow_uris.tiles.224.test}
    tile_size: 224 # 512 224
    margin: 56 # 128 56
    efd_order: 16
    embedding_mode: "efd_spatial" # "efd", "bbox", "efd_pointnet", pointnet

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

mlflow_run_id: e495fe0137d2459c8fd59c674b8e3cb0
