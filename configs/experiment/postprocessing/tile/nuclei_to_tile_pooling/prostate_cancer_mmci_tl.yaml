# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: prediction
  - _self_

metadata_uri: ${dataset.mlflow_uris.metadata.test}
nuclei_predictions_uri: mlflow-artifacts:/97/15afaa140abe4ca3868d43b81d574dbd/artifacts/predictions
pooling_mode: top_k
pooling_k: 4

data:
  dataset:
    uris: ${dataset.mlflow_uris.tiles.224.test} # ${dataset.mlflow_uris.tiles.512.test} ${dataset.mlflow_uris.tiles.224.test}
    tile_size: 224 # 512 224
    margin: 56 # 128 56
    efd_order: 16
    embedding_mode: "blank" # "efd", "bbox", "spatial", "efd_spatial", "blank"

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

