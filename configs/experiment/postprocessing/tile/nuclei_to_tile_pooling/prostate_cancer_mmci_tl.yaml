# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: prediction
  - _self_

metadata_uri: ${dataset.mlflow_uris.metadata.test}
nuclei_predictions_uri: mlflow-artifacts:/97/7b860f365eca4a96bd4edc0c058f6188/artifacts/predictions
pooling_mode: top_k
k: 16

data:
  dataset:
    uris: ${dataset.mlflow_uris.tiles.test}
    tile_size: 512
    margin: 128
    efd_order: 16
    patch_size: 48 # bbox nuclei embeddings

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

mlflow_run_id: aed1da3432694541bfdb82364acfc660
mlflow_parent_run_id: 3b4bd9d620744470a7aa096bc58f0e63

metadata:
  run_name: "📊 Nuclei-Tile Pooling (MMCI)"
