# @package _global_

defaults:
  - /data/sources/prostate_cancer_mmci_tl
  - /data/datasets/tile@data.dataset: prediction
  - _self_

metadata_uri: ${dataset.mlflow_uris.metadata.test}
nuclei_predictions_uri: mlflow-artifacts:/97/414e9aebaab642a397086d0340ab9d86/artifacts/predictions
pooling_mode: top_k
pooling_k: 8

data:
  dataset:
    uris: ${dataset.mlflow_uris.tiles.224.test} # ${dataset.mlflow_uris.tiles.512.test} ${dataset.mlflow_uris.tiles.224.test}
    tile_size: 224 # 512 224
    margin: 56 # 128 56
    efd_order: 16
    embedding_mode: "spatial" # "efd", "bbox", "efd_pointnet", pointnet

    thresholds:
      tissue_roi_t: 0.5
      exclude_t: 0.0
      another_pathology_t: 0.0
      residual_t: 0.25
      blur_t: 0.25
      folding_t: 0.25
      carcinoma_roi_t: 0.5

mlflow_run_id: 9c943983f09f43a48fef6fe3e739f283
