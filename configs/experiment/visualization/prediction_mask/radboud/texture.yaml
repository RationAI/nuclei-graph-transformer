# @package _global_

defaults:
  - /data/sources/panda
  - _self_

mask_tile_width: ${dataset.mask_tile_width}
mask_tile_height: ${dataset.mask_tile_height}
max_concurrent: 1
metadata_uris:
  - ${dataset.providers.radboud.metadata.test}
mlflow_artifact_path: prediction_masks

predictions_uri: mlflow-artifacts:/37/0946c406d23249ccaf5baab638cddab0/artifacts/predictions
checkpoint_url: mlflow-artifacts:/37/843f60f505c84174861d34e1948cece1/artifacts/checkpoints/epoch=152-step=16677/checkpoint.ckpt

metadata:
  run_name: "Nuclei Masks — Prediction (full resolution), Texture: ${dataset.name}"
  description: "Full-resolution heatmap of per-nucleus predictions from the
    Texture model ([MLflow training run](${checkpoint_url})), rasterized
    from already-saved predictions rather than re-running inference."
  hyperparams:
    mask_tile_width: ${mask_tile_width}
    mask_tile_height: ${mask_tile_height}
