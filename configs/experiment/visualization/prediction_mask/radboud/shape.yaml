# @package _global_

defaults:
  - /data/sources/panda
  - _self_

mask_tile_width: ${dataset.mask_tile_width}
mask_tile_height: ${dataset.mask_tile_height}
max_concurrent: 1
metadata_uris:
  - ${dataset.providers.radboud.metadata.test}
mlflow_artifact_path: prediction_masks

predictions_uri: mlflow-artifacts:/37/ca383cf16b414711b10b8ace1980e066/artifacts/predictions
checkpoint_url: mlflow-artifacts:/37/c5fe3bbb1c4e4f18916a87ae72df180f/artifacts/checkpoints/epoch=264-step=28885/checkpoint.ckpt

metadata:
  run_name: "Nuclei Masks — Prediction (full resolution), Shape: ${dataset.name}"
  description: "Full-resolution heatmap of per-nucleus predictions from the
    Shape model ([MLflow training run](${checkpoint_url})), rasterized
    from already-saved predictions rather than re-running inference."
  hyperparams:
    mask_tile_width: ${mask_tile_width}
    mask_tile_height: ${mask_tile_height}
