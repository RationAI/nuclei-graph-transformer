# @package _global_

defaults:
  - /data/sources/panda
  - _self_

mask_tile_width: ${dataset.mask_tile_width}
mask_tile_height: ${dataset.mask_tile_height}
max_concurrent: 1
metadata_uris:
  - ${dataset.providers.radboud.metadata.test}
mlflow_artifact_path: prediction_masks

predictions_uri: mlflow-artifacts:/37/e2a24fb86854407f96d5cf6295259fa0/artifacts/predictions
checkpoint_url: mlflow-artifacts:/37/a07f92db18494dd1a58c54f5736098b9/artifacts/checkpoints/epoch=296-step=32373/checkpoint.ckpt

metadata:
  run_name: "Nuclei Masks — Prediction (full resolution), Positions: ${dataset.name}"
  description: "Full-resolution heatmap of per-nucleus predictions from the
    Positions model ([MLflow training run](${checkpoint_url})), rasterized
    from already-saved predictions rather than re-running inference."
  hyperparams:
    mask_tile_width: ${mask_tile_width}
    mask_tile_height: ${mask_tile_height}
