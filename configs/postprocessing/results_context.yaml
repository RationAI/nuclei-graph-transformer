# @package _global_

# Q3 "How important is tissue context?": tab:res-context, fig:res-context and the epithelial
# nuclei paragraph. Nucleus level, PANDA Radboud test set. Paired slide-level bootstrap over the
# stored test predictions of existing evaluation runs (experiment 37), reusing the resamples and
# the logit grid of the Q2/Q3 positions run (postprocessing.results_sources, MLflow run 4081f97a),
# whose "context" family this run reproduces (all nuclei) and extends (epithelial nuclei).
# No training, no inference.

defaults:
  - /data/sources/panda
  - _self_

# The public project, mounted read-only on the sensitive cluster's notebook (/mnt/projects there).
inputs_path: /mnt/public_projects/nuclei_based_wsi_analysis
metadata_uri: ${dataset.providers.radboud.metadata.test}
supervision_dir: ${inputs_path}/nuclei_supervision/PANDA/Radboud/annotation
label_column: annot_label
predictions_artifact: predictions

# Run 4081f97a7b3040a8a257599e1860d76c (Q2/Q3 positions): its replicates, configurations,
# comparisons and per-run checks are compared with the ones recomputed here.
reference_run: 4081f97a7b3040a8a257599e1860d76c
reference_dir: ${project_path}/evaluation/radboud_test/q2_q3_positions
# Saved by the Q2 run (205c2bea); seed 20261108, 2,000 resamples stratified by positive slide.
resamples: ${inputs_path}/evaluation/radboud_test/q2_sources_bootstrap/bootstrap_resamples_radboud_test.npz

# Shape embedding (NB-A-51), no position encoding, k = 24 (NB-A-68); three seeds each.
configurations:
  self:
    label: nucleus alone (self-only)
    short: self-only
    training_runs: [5dbc2c07, bcd05361, fa631c23]
    eval_runs: [24ef0778c482421ea1776caa0051bf35, 683bc01ddab944919dbc1f53317da338, eaa33dc4279f4c53a001a4754ef144d5]
  knn:
    label: local context (k-NN)
    short: k-NN
    training_runs: [b825727e, 5de0289b, 650b1d8d]
    eval_runs: [28cfe9796d924a3ca31a3922947aca05, be5e23d0adad4c0b8f1e77da8057a7ba, 8eef7874b48c4051aaa86b7b6be4c50f]
  dense:
    label: global context (dense)
    short: dense
    training_runs: [c12da25a, 9584431c, 6210cbbd]
    eval_runs: [9363c68f37da442f89c940d80efa49d5, df298e11a4c543dbaf57a378baab98e6, ba58d016ece74741a93b409d49526e5a]
  thesis:
    label: thesis model (k-NN + RoVE)
    short: k-NN + RoVE
    reference_line: true # not in a comparison; a dashed line in the figure
    training_runs: [5401eebe, 084da1a0, c8f26853]
    eval_runs: [a5ee0cd9d08f4e3e92e5e55d71a1d9a7, 98fc505c09ed41348e5b5b200afd465c, 777fb4134250483bab02ba57ce484ea4]

# Names in 4081f97a's configurations.csv / replicates.npz
reference_names: {self: shape_self, knn: shape_knn_nopos, dense: shape_dense_nopos, thesis: shape_knn}

# The family of this section = run 4081f97a's "context" family (Holm over its AUPRC comparisons).
# The epithelial analysis is its own family with the same three comparisons.
comparisons:
  - name: knn_vs_self
    label: k-NN − self-only
    weights: {knn: 1, self: -1}
  - name: dense_vs_knn
    label: dense − k-NN
    weights: {dense: 1, knn: -1}
  - name: dense_vs_self
    label: dense − self-only
    weights: {dense: 1, self: -1}
reference_comparisons: {knn_vs_self: knn_vs_self, dense_vs_knn: dense_vs_knn, dense_vs_self: dense_vs_self}

# Epithelial nuclei: carcinoma ∪ benign epithelium by the vertex rule (xai.epithelium_separation,
# MLflow run 0b24e5db). Its per-slide class cache (index = id order) is read, not recomputed.
epithelium:
  classes_dir: ${project_path}/evaluation/xai_epithelium_separation/classes/test
  counts: ${project_path}/evaluation/xai_epithelium_separation/counts.csv
  slides: ${inputs_path}/xai/c8f268536be8416f9fe395eea95c458e/slides.parquet

bootstrap:
  ci_level: 0.95
  alpha: 0.05
histogram:
  tolerance: 1.0e-4 # |histogram − exact|, every run, both subsets; grid of run 4081f97a, doubled if needed
  max_bins: 160000
figure:
  recall_grid: 1001

block_mask_fix_commit: 752565f2 # "fix: block mask" (k-NN / dense flex BlockMask double count)
thesis_reference: {AUPRC: 0.904, AUROC: 0.942} # tab:res-nucleus, three decimals

cache_dir: ${project_path}/evaluation/radboud_test/predictions # aligned predictions, one parquet per run
out_dir: ${project_path}/evaluation/radboud_test/q3_context
repo_figures_dir: null # optional copy of res_context.{pdf,png}

metadata:
  run_name: "Q3 context: self-only vs k-NN vs dense (Radboud test, all and epithelial nuclei)"
  hyperparams:
    resamples: ${resamples}
    reference_run: ${reference_run}
    ci_level: ${bootstrap.ci_level}
    alpha: ${bootstrap.alpha}
    histogram_tolerance: ${histogram.tolerance}
