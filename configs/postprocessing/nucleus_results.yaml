# @package _global_

# tab:res-nucleus: nucleus-level test results of the model (shape embedding, rotated values,
# k-NN attention, k = 24) on PANDA Radboud test (postprocessing.nucleus_results).
# Stored test predictions of the three evaluation runs; no training, no inference.

defaults:
  - /data/sources/panda
  - _self_

dataset_label: PANDA Radboud
metadata_uri: ${dataset.providers.radboud.metadata.test}
supervision_dir: ${dataset.providers.radboud.supervision.annotation}
label_column: annot_label # as postprocessing/bootstrap_sources (dense labels, no ignore list)
predictions_artifact: predictions

# Evaluation runs (experiment 37); the training run of each is its mlflow.parentRunId.
eval_runs:
  - a5ee0cd9d08f4e3e92e5e55d71a1d9a7
  - 98fc505c09ed41348e5b5b200afd465c
  - 777fb4134250483bab02ba57ce484ea4

# Every training run must have exactly this configuration (MLflow params).
expected_config:
  embedding_mode: efd
  context: knn
  k: "24"
  use_rope: "True"
  attention_variant: vrope # rotated values
checkpoint_monitor: validation/loss # the ModelCheckpoint of the training run (validation split of train)
block_mask_fix_date: "2026-10-30" # nuclei_graph/data/block_mask.py double-count fix

# Canonical slide resamples of Radboud test (made by postprocessing.bootstrap_sources, Q2);
# Q2, Q3 and Q4 reuse this file, so it is reused here unchanged, not redrawn.
resamples: ${project_path}/evaluation/radboud_test/q2_sources_bootstrap/bootstrap_resamples_radboud_test.npz
resamples_seed: 20261108
ci_level: 0.95

histogram:
  n_bins: 100000 # uniform over the logit range of the three runs, shared by all slides
  max_bins: 400000
  tolerance: 1.0e-4 # |histogram − exact torchmetrics| for every run's full-test-set AUROC and AUPRC

cache_dir: ${project_path}/evaluation/radboud_test/predictions # aligned predictions, one parquet per run (Q2)
out_dir: ${project_path}/evaluation/radboud_test/nucleus_results

metadata:
  run_name: "tab:res-nucleus: shape, k-NN + rotated values (Radboud test)"
  hyperparams:
    dataset: ${dataset_label}
    n_eval_runs: 3
    resamples_seed: ${resamples_seed}
    ci_level: ${ci_level}
    histogram_tolerance: ${histogram.tolerance}
