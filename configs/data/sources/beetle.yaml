# @package _global_

dataset:
  name: BEETLE

  mask_tile_width: 512
  mask_tile_height: 512
  
  paths: 
    wsi_data:
      # dataset root; `wsi_path` and annotation paths in the overview CSV are relative to it
      root: ${data_path}/Public/Public/breast/BEETLE

      slides: ${dataset.paths.wsi_data.root}/data/images/development/wsis
    
      # dataset-provided index of slides, annotations, and splits
      overview_csv: ${dataset.paths.wsi_data.root}/data_overview.csv
      
    annotations:
      xml: ${dataset.paths.wsi_data.root}/annotations/xmls
      json: ${dataset.paths.wsi_data.root}/annotations/jsons
      tif: ${dataset.paths.wsi_data.root}/annotations/masks

    # preprocessing/nuclei_segmentation.py
    nuclei_seg: ${project_path}/nuclei_segmentation/BEETLE

  mlflow_uris:
    # exploration/beetle/save_metadataset.py
    exploration: mlflow-artifacts:/37/69e68626aa11483d8d2f5eae3a24f853/artifacts/beetle/slides_metadata.csv

    masks:
      # preprocessing/tissue_masks.py
      tissue: mlflow-artifacts:/37/d5cb346183094fbd892652a27b3b6e4a/artifacts/tissue_masks
      
      # preprocessing/annotation_masks/beetle.py
      carcinoma: ???