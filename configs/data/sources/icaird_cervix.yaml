# @package _global_

dataset:
  name: iCAIRD Cervix

  mask_tile_width: 512
  mask_tile_height: 512
  
  paths:
    wsi_data:
      slides_isyntax: ${project_path}/nuclei_based_wsi_analysis/iCAIRD/cervical/slides_isyntax
      slides: ${data_path}/Public/Public/cervix/iCAIRD/slides

      # dataset-provided index of slide/annotation pairs, categories, and the train/valid split
      metadata_csv: ${data_path}/Public/Public/cervix/iCAIRD/index.csv

    annotations: ${data_path}/Public/Public/cervix/iCAIRD/annotations

  mlflow_uris:
    # preprocessing/exploration/icaird_cervix/save_metadataset.py
    exploration: ${mlflow_project_pc}/93f193ea5d9a4e3fb5e94c8b5df4bbd0/artifacts/icaird_cervix/slides_metadata.csv

    masks:
      annotation:
        # preprocessing/annotation_masks/icaird_cervix_per_class.py
        per_class:
          high_grade: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/high_grade
          malignant: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/malignant
          low_grade: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/low_grade
          normal_inflammation: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/normal_inflammation

        # preprocessing/annotation_masks/icaird_cervix_carcinoma.py
        merged:
          carcinoma: ${mlflow_project_pc}/7b33b3027aa142719eb792890ff95d82/artifacts/carcinoma

