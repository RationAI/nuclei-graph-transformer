# @package _global_

dataset:
  name: iCAIRD Cervix
  mpp: 0.25

  # Subfolder of `paths.nuclei_seg` the rest of the pipeline reads nuclei from:
  # cervix_cellpose (Cellpose) or cervix_lsp-detr (LSP-DETR).
  nuclei_batch: cervix_cellpose

  # Diagnoses (`category` of the index) of train, valid and test. Low grade is used nowhere (no
  # training, validation or evaluation) and is in no metadata table.
  categories: [normal_inflammation, high_grade, malignant]

  mask_tile_width: 512
  mask_tile_height: 512

  paths:
    wsi_data:
      slides_isyntax: ${project_path}/nuclei_based_wsi_analysis/iCAIRD/cervical/slides_isyntax
      slides: ${data_path}/Public/Public/cervix/iCAIRD/slides

      # dataset-provided index of slide/annotation pairs, categories, and the train/valid split
      metadata_csv: ${data_path}/Public/Public/cervix/iCAIRD/index.csv

    annotations: ${data_path}/Public/Public/cervix/iCAIRD/annotations

    # preprocessing/nuclei_segmentation.py; one subfolder per segmentation batch
    nuclei_seg: ${project_path}/nuclei_segmentation/iCAIRD

    supervision:
      # preprocessing/unipolar_heatmap_labels.py (train / valid; coarse dataset annotations)
      annotation: ${project_path}/nuclei_supervision/iCAIRD/annotation
      # preprocessing/reannotation_labels_icaird_cervix.py (the re-annotated positive test slides:
      # 1 = inside the pathologist's regions, 0 = unlabelled); annotation_sparse only
      reannotation: ${project_path}/nuclei_supervision/iCAIRD/reannotation

  mlflow_uris:
    # preprocessing/exploration/icaird_cervix/save_metadataset.py
    exploration: ${mlflow_project_pc}/93f193ea5d9a4e3fb5e94c8b5df4bbd0/artifacts/icaird_cervix/slides_metadata.csv

    # scripts/preprocessing/quality_control/blur_exclusion_icaird_cervix.py: slides with
    # median blur coverage >= 0.2 (rule of PANDA - Radboud); 23 slides, none re-annotated
    qc_exclusion: ${mlflow_project_pc}/59ed1027e0f14a139d54dac6715d20e1/artifacts/qc_exclusion/to_exclude_based_on_qc.csv

    # the 60 test slides (high grade / malignant) re-annotated precisely by a pathologist
    # (annotation report run; columns slide_id, category, subcategory, positive_tissue_area_mm2)
    reannotated_test_slides: ${mlflow_project_pc}/0fc2b02cf7864c508d2868b25ce7b5e6/artifacts/selected_slides.csv

    # preprocessing/metadata_mapping/icaird_cervix.py (cleaned Cellpose batch; blur-excluded slides and
    # slides with no nuclei left out; no low grade in train, valid or test; test = the 60 re-annotated
    # slides + normal / inflammation): train 792, valid 392, test 245 slides. (The run's
    # slides_mapping_test_low_grade table was deleted on 2026-11-16: low grade is not used.)
    metadata:
      train: ${mlflow_project_pc}/bbacb1c8f3334be5b2edc1bb077a22a7/artifacts/icaird_cervix/slides_mapping_train.parquet
      valid: ${mlflow_project_pc}/bbacb1c8f3334be5b2edc1bb077a22a7/artifacts/icaird_cervix/slides_mapping_valid.parquet
      test: ${mlflow_project_pc}/bbacb1c8f3334be5b2edc1bb077a22a7/artifacts/icaird_cervix/slides_mapping_test.parquet

    masks:
      annotation:
        # preprocessing/annotation_masks/icaird_cervix_per_class.py
        per_class:
          high_grade: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/high_grade
          malignant: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/malignant
          low_grade: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/low_grade
          normal_inflammation: ${mlflow_project_pc}/93f7b7810011443eba78350bd1eb19a0/artifacts/normal_inflammation

        # preprocessing/annotation_masks/icaird_cervix_carcinoma.py
        merged:
          carcinoma: ${mlflow_project_pc}/7b33b3027aa142719eb792890ff95d82/artifacts/carcinoma

      # preprocessing/tissue_masks/icaird_cervix.py
      tissue: mlflow-artifacts:/37/fef378b6af1049949495e84c985b0fc4/artifacts/tissue_masks

