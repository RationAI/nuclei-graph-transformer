# @package _global_

dataset:
  name: PANDA

  mask_tile_width: 512
  mask_tile_height: 512

  paths:
    wsi_data:
      slides: ${data_path}/Public/Public/prostate/PANDA/train_images

      # reference ground truth information from the competition
      metadata: ${data_path}/Public/Public/prostate/PANDA/train.csv

      # dataframe with slide-level properties (mpps and extents) and ids of nuclei segmentation files
      slides_properties: /mnt/projects/nuclei_foundation_model/nuclei/PANDA/slides.parquet

      # slides to exclude based on QC masks (see prostate cancer repository)
      exclude_qc:
        - "/mnt/projects/prostate_cancer/cancer/qc_masks/PANDA - Radboud/to_exclude_based_on_qc.csv"
        - "/mnt/projects/prostate_cancer/cancer/qc_masks/PANDA - Karolinska/to_exclude_based_on_qc.csv"

    nuclei:
      raw: /mnt/projects/nuclei_foundation_model/nuclei/PANDA/dataset=PANDA
      # preprocessing/nuclei_standardization.py
      standardized: ${project_path}/nuclei_segmentation/PANDA

    masks:
      annotation: ${data_path}/Public/Public/prostate/PANDA/train_label_masks
      carcinoma: mlflow-artifacts:/38/cd504aaafb8c408184584d808a99cf15/artifacts/carcinoma_mask

  mlflow_uris:
    # preprocessing/exploration/panda/save_metadataset.py
    exploration: ${mlflow_project_pc}/520a6e160a034073b5a03858840d4df2/artifacts/panda/slides_metadata.csv

  providers:
    radboud:
      # preprocessing/data_split.py
      split: ${mlflow_project_pc}/c39479757cd24b969f5fc8a250ed0a56/artifacts/radboud_split/split.csv

      # preprocessing/metadata_mapping/panda.py
      metadata:
        train: ${mlflow_project_pc}/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
        test: ${mlflow_project_pc}/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_test.parquet
        predict: null

      supervision:
        # preprocessing/unipolar_heatmap_labels.py
        annotation: ${project_path}/nuclei_supervision/PANDA/Radboud/annotation

      tiles: # filtered
        "512":
          train:
            - mlflow-artifacts:/38/e1ef2698c62541e4a5e92a65ecb36fa5/artifacts/PANDA - Radboud train_512
            - mlflow-artifacts:/38/b38ca47d6fd4422a9f8d5a32fcae221c/artifacts/PANDA - Radboud val_512
          test:
            - mlflow-artifacts:/38/0525b745d0954fb6ace98ead20042faf/artifacts/PANDA - Radboud test_512
        "224":
          train:
            - mlflow-artifacts:/38/e1ef2698c62541e4a5e92a65ecb36fa5/artifacts/PANDA - Radboud train_224
            - mlflow-artifacts:/38/b38ca47d6fd4422a9f8d5a32fcae221c/artifacts/PANDA - Radboud val_224
          test:
            - mlflow-artifacts:/38/0525b745d0954fb6ace98ead20042faf/artifacts/PANDA - Radboud test_224

    karolinska:
      # preprocessing/data_split.py
      split: ${mlflow_project_pc}/5afdb3f7e3b44f2c9bac4a36deed6663/artifacts/karolinska_split/split.csv

      # preprocessing/metadata_mapping/panda.py
      metadata:
        train: ${mlflow_project_pc}/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
        test: ${mlflow_project_pc}/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_test.parquet
        predict: null

      supervision:
        # preprocessing/unipolar_heatmap_labels.py
        annotation: ${project_path}/nuclei_supervision/PANDA/Karolinska/annotation
